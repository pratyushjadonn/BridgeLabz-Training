spring.application.name=fundoo-notes-app

# ---- Database (Use Case 1) ----
spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# NOTE (from the guide's "Worth Adding Next"):
# Once the schema stabilizes (Use Case 16), switch ddl-auto to "validate".

# ---- JWT (Use Case 2 & 3) ----
# Day 13/16 lesson: never hardcode this in real deployments - move to an
# environment variable before Use Case 26 (SonarQube) flags it.
app.jwt.secret=ChangeThisToALongRandomBase64EncodedSecretKeyForJWTSigning123456
app.jwt.expiration-ms=3600000

